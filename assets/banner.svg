<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Neon Gradients -->
    <linearGradient id="cyan-violet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glow-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.03" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
    }
    .tagline-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #38bdf8;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #e2e8f0;
    }

    /* Animated background elements */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
    }
    @keyframes scanBeam {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.6; }
      100% { transform: translateY(220px); opacity: 0.1; }
    }
    @keyframes waveDash {
      to { stroke-dashoffset: -100; }
    }

    .glow-orb-1 {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .glow-orb-2 {
      animation: pulseGlow 8s ease-in-out infinite reverse;
      transform-origin: 1000px 280px;
    }
    .particle-1 { animation: floatParticle 5s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
    .scanner-line { animation: scanBeam 4s linear infinite; }
    .flow-line { stroke-dasharray: 6 6; animation: waveDash 3s linear infinite; }
  </style>

  <!-- Deep Slate Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient Glowing Orbs (Background layer) -->
  <circle cx="180" cy="90" r="140" fill="#38bdf8" opacity="0.12" filter="url(#neon-glow)" class="glow-orb-1" />
  <circle cx="1020" cy="270" r="160" fill="#818cf8" opacity="0.12" filter="url(#neon-glow)" class="glow-orb-2" />
  <circle cx="880" cy="80" r="90" fill="#c084fc" opacity="0.08" filter="url(#neon-glow)" />

  <!-- Subtle Matrix Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Interactive Document Graphic on Right Side (Background-Safe) -->
  <g transform="translate(860, 65)">
    <!-- Document Backdrop -->
    <rect x="0" y="0" width="260" height="230" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Header of Mock Doc -->
    <rect x="20" y="22" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="230" cy="26" r="4" fill="#22c55e" />
    <line x1="20" y1="42" x2="240" y2="42" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Mock Text Rows -->
    <rect x="20" y="55" width="160" height="6" rx="3" fill="#475569" opacity="0.6" />
    <rect x="20" y="70" width="200" height="6" rx="3" fill="#475569" opacity="0.4" />
    <rect x="20" y="85" width="130" height="6" rx="3" fill="#475569" opacity="0.4" />

    <!-- Mock Multimodal Visual Bounding Box (OCR / Vision Detection) -->
    <rect x="20" y="108" width="110" height="75" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.5" />
    <text x="30" y="125" font-family="monospace" font-size="9" fill="#38bdf8">bbox [table_ai]</text>
    <rect x="30" y="135" width="90" height="4" rx="2" fill="#38bdf8" opacity="0.4" />
    <rect x="30" y="145" width="70" height="4" rx="2" fill="#38bdf8" opacity="0.3" />
    <rect x="30" y="155" width="80" height="4" rx="2" fill="#38bdf8" opacity="0.3" />

    <rect x="142" y="108" width="98" height="75" rx="6" fill="#1e293b" stroke="#c084fc" stroke-dasharray="3 3" stroke-width="1.5" />
    <text x="150" y="125" font-family="monospace" font-size="9" fill="#c084fc">bbox [chart_vlm]</text>
    <!-- Mini Chart Graphic inside BBox -->
    <path d="M 152 165 L 170 145 L 188 155 L 210 135 L 228 140" fill="none" stroke="#c084fc" stroke-width="2" />

    <!-- Animated Document Scanning Laser -->
    <line x1="10" y1="0" x2="250" y2="0" stroke="url(#cyan-violet)" stroke-width="2" filter="url(#neon-glow)" class="scanner-line" />

    <!-- JSON / Structured Graph Node Indicator -->
    <g transform="translate(40, 196)">
      <rect x="0" y="0" width="180" height="22" rx="11" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
      <circle cx="14" cy="11" r="4" fill="#a855f7" />
      <text x="26" y="15" font-family="monospace" font-size="10" fill="#a5b4fc">JSON • Markdown • Graph</text>
    </g>
  </g>

  <!-- Flow connecting line -->
  <path d="M 720 180 C 780 180, 800 180, 860 180" fill="none" stroke="#38bdf8" stroke-width="2" class="flow-line" opacity="0.6" />

  <!-- Foreground Title and Content (Ensured Clear & In Foreground) -->
  <g transform="translate(70, 60)">
    <!-- Category Badge -->
    <rect x="0" y="0" width="310" height="28" rx="14" fill="#0f172a" stroke="#0284c7" stroke-width="1.2" />
    <circle cx="16" cy="14" r="5" fill="#38bdf8" />
    <text x="30" y="19" class="tagline-text">Curated Document AI Ecosystem</text>

    <!-- Main Title -->
    <text x="0" y="80" class="title-text">
      Multimodal Document Understanding
    </text>
    <text x="0" y="125" class="title-text" fill="url(#cyan-violet)">
      &amp; Intelligent AI Analysis
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" class="subtitle-text">
      Vision-Language Models, Layout OCR, Document RAG &amp; IDP Engineering
    </text>

    <!-- Interactive Badges/Pills Row -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="17" r="4" fill="#38bdf8" />
      <text x="32" y="22" class="pill-text">Agentic Parsing</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="173" cy="17" r="4" fill="#818cf8" />
      <text x="187" y="22" class="pill-text">VLM OCR 2.0</text>

      <!-- Pill 3 -->
      <rect x="295" y="0" width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="313" cy="17" r="4" fill="#c084fc" />
      <text x="327" y="22" class="pill-text">Layout &amp; Tables</text>

      <!-- Pill 4 -->
      <rect x="440" y="0" width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="458" cy="17" r="4" fill="#34d399" />
      <text x="472" y="22" class="pill-text">Knowledge RAG</text>
    </g>
  </g>

  <!-- Animated ambient floating dots -->
  <circle cx="70" cy="315" r="3" fill="#38bdf8" class="particle-1" />
  <circle cx="480" cy="325" r="2.5" fill="#818cf8" class="particle-2" />
  <circle cx="780" cy="50" r="3" fill="#c084fc" class="particle-3" />
</svg>